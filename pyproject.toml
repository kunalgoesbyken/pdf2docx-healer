[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2docx-healer"
dynamic = ["version"]
description = "PDF to Word (DOCX) converter that keeps headings, real lists, links, tables and right-to-left text; a drop-in upgrade for pdf2docx"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pdf2docx>=0.5.9,<0.6",
    "PyMuPDF>=1.27.1",
    "python-docx>=1.1.0",
    "lxml>=4.9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
]
keywords = ["pdf", "docx", "word", "converter", "pdf-to-docx", "pdf-to-word", "pdf2docx", "headings", "lists", "hyperlink", "ocr", "cjk", "rtl"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
    "mypy",
    "lxml-stubs",
]

[project.scripts]
pdf2docx-heal = "docx_healer.cli:main"

[project.urls]
homepage = "https://github.com/kunalgoesbyken/pdf2docx-healer"
repository = "https://github.com/kunalgoesbyken/pdf2docx-healer"
issues = "https://github.com/kunalgoesbyken/pdf2docx-healer/issues"
changelog = "https://github.com/kunalgoesbyken/pdf2docx-healer/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "docx_healer.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/docx_healer/constants.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
