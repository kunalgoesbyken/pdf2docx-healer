[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2docx-healer"
dynamic = ["version"]
description = "Formatting-preserving PDF-to-DOCX converter that fixes bullet lists, hyperlinks, CJK fonts, and scanned PDFs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "pdf2docx>=0.5.9,<0.6",
    "PyMuPDF>=1.23.0",
    "python-docx>=0.8.11",
    "lxml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Office/Business :: Office Suites",
]
keywords = ["pdf", "docx", "converter", "pdf-to-docx", "formatting", "hyperlink", "ocr", "cjk", "bullet-list"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
    "mypy",
    "lxml-stubs",
]

[project.scripts]
pdf2docx-heal = "docx_healer.cli:main"

[project.urls]
homepage = "https://github.com/kunalgoesbyken/pdf2docx-healer"
repository = "https://github.com/kunalgoesbyken/pdf2docx-healer"
issues = "https://github.com/kunalgoesbyken/pdf2docx-healer/issues"
changelog = "https://github.com/kunalgoesbyken/pdf2docx-healer/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "docx_healer.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035"]

[tool.ruff.lint.per-file-ignores]
"src/docx_healer/constants.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
