[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2docx-healer"
version = "0.1.3"
description = "Formatting-preserving PDF-to-DOCX converter that fixes bullet lists, hyperlinks, CJK fonts, and scanned PDFs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "pdf2docx>=0.5.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=0.8.11",
    "lxml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Office/Business :: Office Suites",
]
keywords = ["pdf", "docx", "converter", "pdf-to-docx", "formatting", "hyperlink", "ocr", "cjk", "bullet-list"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
pdf2docx-heal = "docx_healer.cli:main"

[project.urls]
homepage = "https://github.com/krockxz/pdf2docx-healer"
repository = "https://github.com/krockxz/pdf2docx-healer"
issues = "https://github.com/krockxz/pdf2docx-healer/issues"
changelog = "https://github.com/krockxz/pdf2docx-healer/releases"

[tool.setuptools.packages.find]
where = ["src"]
